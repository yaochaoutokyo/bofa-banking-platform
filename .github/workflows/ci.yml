# Monorepo CI.
#
# Only services with a configured test runner have a job here. Services without
# one (payments-gateway, pii-vault-service, kyc-service) and several
# compliance-critical services (transaction-service, auth-service,
# audit-logging-service, customer-portal-api) have NO test job and are therefore
# not gated by CI today.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  # ---------------------------------------------------------------- Java ----
  ledger-service:
    name: ledger-service (Java)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ledger-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test with coverage
        run: mvn -B -q test
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/ledger-service/target/site/jacoco/jacoco.xml
          flags: ledger-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage summary
        run: python3 ../../scripts/coverage-summary.py --service ledger-service --github-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-ledger-service
          path: services/ledger-service/target/site/jacoco/jacoco.xml

  # -------------------------------------------------------------- Python ----
  fraud-detection-service:
    name: fraud-detection-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fraud-detection-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/fraud-detection-service/coverage.xml
          flags: fraud-detection-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage summary
        run: python3 ../../scripts/coverage-summary.py --service fraud-detection-service --github-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-fraud-detection-service
          path: services/fraud-detection-service/coverage.xml

  notification-service:
    name: notification-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test with coverage
        run: pytest --cov=app --cov-report=xml --cov-report=term
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/notification-service/coverage.xml
          flags: notification-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage summary
        run: python3 ../../scripts/coverage-summary.py --service notification-service --github-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-notification-service
          path: services/notification-service/coverage.xml

  # ---------------------------------------------------------- TypeScript ----
  account-service:
    name: account-service (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/account-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/account-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test with coverage
        run: npm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/account-service/coverage/lcov.info
          flags: account-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage summary
        run: python3 ../../scripts/coverage-summary.py --service account-service --github-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-account-service
          path: services/account-service/coverage/coverage-summary.json

  statement-service:
    name: statement-service (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/statement-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/statement-service/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Test with coverage
        run: npm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: services/statement-service/coverage/lcov.info
          flags: statement-service
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
      - name: Coverage summary
        run: python3 ../../scripts/coverage-summary.py --service statement-service --github-summary >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-statement-service
          path: services/statement-service/coverage/coverage-summary.json

  # ---------------------------------------------------------------- Gate ----
  # Required status check for branch protection on `main`.
  ci-gate:
    name: CI gate (all tested services pass)
    runs-on: ubuntu-latest
    needs:
      - ledger-service
      - fraud-detection-service
      - notification-service
      - account-service
      - statement-service
    if: always()
    steps:
      - name: Fail if any test job failed
        run: |
          echo "Results: ${{ toJSON(needs) }}"
          if echo '${{ toJSON(needs) }}' | grep -Eq '"result": *"(failure|cancelled)"'; then
            echo "One or more test jobs failed."; exit 1
          fi
          echo "All configured test jobs passed."

  # ---------------------------------------------------------- Scoreboard ----
  # After a merge to main, regenerate the README badges/tables from the reports
  # produced above (services without a CI job keep their committed baseline).
  update-scoreboard:
    name: Update README coverage scoreboard
    runs-on: ubuntu-latest
    needs: ci-gate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-gate.result == 'success'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: .coverage-artifacts
      - name: Place reports where coverage-summary.py expects them
        run: |
          set -e
          install -D .coverage-artifacts/coverage-ledger-service/jacoco.xml services/ledger-service/target/site/jacoco/jacoco.xml
          install -D .coverage-artifacts/coverage-fraud-detection-service/coverage.xml services/fraud-detection-service/coverage.xml
          install -D .coverage-artifacts/coverage-notification-service/coverage.xml services/notification-service/coverage.xml
          install -D .coverage-artifacts/coverage-account-service/coverage-summary.json services/account-service/coverage/coverage-summary.json
          install -D .coverage-artifacts/coverage-statement-service/coverage-summary.json services/statement-service/coverage/coverage-summary.json
      - name: Regenerate scoreboard
        run: python3 scripts/coverage-summary.py --write
      - name: Commit if changed
        run: |
          if git diff --quiet -- README.md scripts/coverage-baseline.json; then
            echo "Scoreboard already up to date."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md scripts/coverage-baseline.json
          git commit -m "chore: update coverage scoreboard [skip ci]"
          git push
